name: Worktree release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit
        id: source
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH without leading zeroes." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
              echo "The release tag must point to a commit on main." >&2
              exit 1
            fi
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Build and test
        shell: bash
        run: |
          make install
          make test
          make dist

      - name: Check distribution and write checksums
        working-directory: bin/dist
        shell: bash
        run: |
          binaries=(
            worktree-linux-amd64
            worktree-linux-arm64
            worktree-darwin-amd64
            worktree-darwin-arm64
            worktree-windows-amd64.exe
          )
          for binary in "${binaries[@]}"; do
            if [[ ! -f "$binary" || ! -s "$binary" ]]; then
              echo "Missing or empty distribution binary: $binary" >&2
              exit 1
            fi
          done
          sha256sum "${binaries[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worktree-dist
          if-no-files-found: error
          path: |
            bin/dist/worktree-linux-amd64
            bin/dist/worktree-linux-arm64
            bin/dist/worktree-darwin-amd64
            bin/dist/worktree-darwin-arm64
            bin/dist/worktree-windows-amd64.exe
            bin/dist/SHA256SUMS

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: worktree-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worktree-dist
          path: dist

      - name: Verify release assets
        working-directory: dist
        shell: bash
        run: |
          shopt -s dotglob nullglob
          binaries=(
            worktree-linux-amd64
            worktree-linux-arm64
            worktree-darwin-amd64
            worktree-darwin-arm64
            worktree-windows-amd64.exe
          )
          diff -u \
            <(printf '%s\n' "${binaries[@]}" SHA256SUMS | LC_ALL=C sort) \
            <(printf '%s\n' * | LC_ALL=C sort)
          diff -u SHA256SUMS <(sha256sum "${binaries[@]}")

      - name: Publish release for the verified tag
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "$GITHUB_REF" "$GITHUB_REF^{}")
          tag_commit=$(awk -v ref="$GITHUB_REF" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print (peeled != "" ? peeled : direct) }
          ' <<< "$refs")
          if [[ "$tag_commit" != "$BUILD_COMMIT" ]]; then
            echo "The remote tag no longer points to the commit that was built." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            worktree-linux-amd64 worktree-linux-arm64 \
            worktree-darwin-amd64 worktree-darwin-arm64 \
            worktree-windows-amd64.exe SHA256SUMS
